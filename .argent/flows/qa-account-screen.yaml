steps:
  - echo: Open the watched-list screen from the board header; the device summary and watched count must show with the IMDb import door, and back returns to the board
  - launch: com.delfiapp.tvimdbrandomizer
  - await: { visible: { id: btn-roll } }
  - await: { idle: true }
  - echo: Up 11 presses reaches the account chip in the header; select it
  - tool: tv-remote
    args: { button: [up, up, up, up, up, up, up, up, up, up, up] }
    delayMs: 700
  - tool: tv-remote
    args: { button: [right, right] }
  - tool: tv-remote
    args: { button: select }
  - await: { visible: { id: account-import } }
  - await: { visible: { id: account-watched-count } }
  - await: { visible: { text: titles you have watched never roll again } }
  - await: { idle: true }
  - echo: Back returns to the board
  - tool: tv-remote
    args: { button: back }
  - await: { visible: { id: btn-roll } }
  - await: { idle: true }
