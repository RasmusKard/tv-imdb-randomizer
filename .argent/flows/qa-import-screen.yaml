steps:
  - echo: Open the import screen from the account; the paste route must be offered, and back returns to the board
  - launch: com.delfiapp.tvimdbrandomizer
  - await: { visible: { id: btn-roll } }
  - await: { idle: true }
  - echo: Up 11 to the account chip, select, expect the account screen
  - tool: tv-remote
    args: { button: [up, up, up, up, up, up, up, up, up, up, up] }
    delayMs: 700
  - tool: tv-remote
    args: { button: [right, right] }
  - tool: tv-remote
    args: { button: select }
  - await: { visible: { id: account-import } }
  - await: { idle: true }
  - echo: Select Import from IMDb; expect the import screen
  - tool: tv-remote
    args: { button: select }
  - await: { visible: { id: import-paste } }
  - await: { visible: { id: import-back } }
  - await: { idle: true }
  - echo: This Android TV emulator has no Wi-Fi address, so the import screen must fall back to its paste-CSV mode and say so in the header
  - assert: { text: { in: { text: 'no upload server' }, contains: 'paste CSV is the way in' } }
  - echo: Back returns to the board
  - tool: tv-remote
    args: { button: back }
  - await: { visible: { id: btn-roll } }
  - await: { idle: true }
