steps:
  - echo: Open the import screen from the account; the QR is the only route, and on the ATV emulator it is fatally disabled with the header saying so
  - launch: com.delfiapp.tvimdbrandomizer
  - await: { visible: { id: btn-roll } }
  - await: { idle: true }
  - echo: Up 11 to the account chip, select, expect the account screen
  - tool: tv-remote
    args: { button: [up, up, up, up, up, up, up, up, up, up, up] }
    delayMs: 700
  - tool: tv-remote
    args: { button: [right, right] }
  - tool: tv-remote
    args: { button: select }
  - await: { visible: { id: account-import } }
  - await: { idle: true }
  - echo: Select Import from IMDb; expect the import screen with only Back in the dock
  - tool: tv-remote
    args: { button: select }
  - await: { visible: { id: import-back } }
  - await: { visible: { id: import-back } }
  - await: { idle: true }
  - echo: This Android TV emulator has no LAN address, so the QR is fatally disabled and the header says so
  - assert: { text: { in: { text: 'no upload server' }, contains: 'check the network and reopen' } }
  - echo: Back returns to the board
  - tool: tv-remote
    args: { button: back }
  - await: { visible: { id: btn-roll } }
  - await: { idle: true }
