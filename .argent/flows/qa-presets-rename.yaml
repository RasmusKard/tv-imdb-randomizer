steps:
  - echo: Rename a kept preset by typing a new name — the name applies as typed and survives a relaunch; the card must carry it. Starts by keeping this board and ends with the preset deleted
  - launch: com.delfiapp.tvimdbrandomizer
  - await: { visible: { id: btn-roll } }
  - await: { idle: true }
  - echo: Up 11 to the header, right onto your presets, select
  - tool: tv-remote
    args: { button: [up, up, up, up, up, up, up, up, up, up, up] }
  - tool: tv-remote
    args: { button: right }
  - tool: tv-remote
    args: { button: select }
  - await: { visible: { id: preset-keep } }
  - await: { idle: true }
  - echo: Keep this board
  - tool: tv-remote
    args: { button: select }
  - await: { visible: { text: Load preset } }
  - echo: Down to the card, two rights onto Rename, select; the name field opens empty and focused, ready to type
  - tool: tv-remote
    args: { button: down }
    delayMs: 600
  - tool: tv-remote
    args: { button: [right, right] }
  - tool: tv-remote
    args: { button: select }
  - await: { visible: { id: preset-rename-input } }
  - echo: Type night picks; the field must hold exactly the typed name — it opens empty, so typing writes the whole name. The name applies as typed (storage carries every keystroke; the TV editor never releases focus for a done press)
  - tool: keyboard
    args: { text: night picks }
  - assert: { text: { in: { id: preset-rename-input }, equals: night picks } }
  - echo: Relaunch; the renamed card must come back from storage — the rename persisted
  - tool: restart-app
    args: { bundleId: com.delfiapp.tvimdbrandomizer }
  - await: { visible: { id: btn-roll } }
  - await: { idle: true }
  - tool: tv-remote
    args: { button: [up, up, up, up, up, up, up, up, up, up, up] }
    delayMs: 700
  - tool: tv-remote
    args: { button: right }
  - tool: tv-remote
    args: { button: select }
  - await: { visible: { text: Load preset night picks } }
  - await: { idle: true }
  - echo: Clean up - delete the card, the list must empty
  - tool: tv-remote
    args: { button: down }
    delayMs: 600
  - tool: tv-remote
    args: { button: [right, right, right] }
  - tool: tv-remote
    args: { button: select }
  - await: { visible: { text: no presets yet } }
  - tool: tv-remote
    args: { button: back }
  - await: { visible: { id: btn-roll } }
  - await: { idle: true }
