steps:
  - echo: >-
      Focus the rating slider and replay a real-device HOLD through the __DEV__
      seam: globalThis.__tvdHold emits the one longLeft DOWN and the UP 4.2s in
      — exactly the two events RN lets a held key deliver (the native repeat
      stream is swallowed upstream, so no remote tooling can hold a key where
      the slider would see it). The focused slider is already its adjusting
      state — no arm press exists — so the hold lands on the live lower end.
      The slider must STREAM notches: a hold that lands only the long-press
      notch is the regression this pins. The ramp's exact cadence is
      renderer-load-bound (swiftshader quantizes timers to frames; ~24 notches
      per 4.2s hold on the dev booth, full traverse on real hardware), so the
      assert bounds the count, not the pace. Needs the debug build with Metro
      connected — the seam is __DEV__-only. Ends reset to the board's defaults.
  - launch: com.delfiapp.tvimdbrandomizer
  - await: { visible: { id: btn-roll } }
  - await: { idle: true }
  - echo: Nine ups walk the focus ladder onto the rating slider itself (the band row below it is eight)
  - tool: tv-remote
    args:
      button: [up, up, up, up, up, up, up, up, up]
    delayMs: 700
  - assert: { text: { in: { id: slider-rating }, contains: 'Rating 5.0 to 10.0' } }
  - echo: >-
      A held left lands the long-press notch, then keeps ticking — 4.2s must
      carry it at least past 4.8 (two notches). The stalled build stopped at
      4.9 and fails here; the dev emulator streams to ~2.6, real hardware to
      the 0.0 clamp.
  - tool: debugger-evaluate
    args: { expression: "__tvdHold('longLeft', 4200); 'hold scheduled'" }
    delayMs: 4500
  - assert: { text: { in: { id: slider-rating }, matches: '^Rating (4\.[0-8]|[0-3]\.[0-9]) to 10\.0' } }
  - echo: Down to the band row, then three ups to the header reset chip; select it and the board returns to its defaults
  - tool: tv-remote
    args: { button: down }
  - tool: tv-remote
    args: { button: [up, up, up] }
    delayMs: 800
  - tool: tv-remote
    args: { button: select }
  - await: { text: { in: { id: slider-rating }, contains: 'Rating 5.0 to 10.0' } }
