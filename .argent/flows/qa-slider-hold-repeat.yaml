steps:
  - echo: Arm the rating slider's lower handle, then send a tight burst of eight discrete rights; every press must land exactly one notch. Adb presses arrive as ACTION_UP only (the initial DOWN is eaten by the focus engine), so the UP is a press's one guaranteed move — a real held key drives the OS repeat stream (longRight/longLeft DOWNs, one notch each) instead
  - launch: com.delfiapp.tvimdbrandomizer
  - await: { visible: { id: btn-roll } }
  - await: { idle: true }
  - echo: Nine ups walk the focus ladder onto the rating slider itself (the band row below it is eight)
  - tool: tv-remote
    args:
      button: [up, up, up, up, up, up, up, up, up]
    delayMs: 700
  - await: { text: { in: { id: slider-rating }, equals: 'Rating 5.0 to 10.0' } }
  - echo: OK arms the lower handle; the OK-walk hint appearing proves the slider took the keys
  - tool: tv-remote
    args: { button: select }
  - await: { visible: { text: 'ok: lower · upper · done — arrows adjust' } }
  - echo: Eight discrete rights in one call — the automation stand-in for holding the key down
  - tool: tv-remote
    args: { button: right, repeat: 8 }
  - await: { text: { in: { id: slider-rating }, equals: 'Rating 5.8 to 10.0' } }
  - echo: Back closes the edit without committing anything further; the value stands at 5.8
  - tool: tv-remote
    args: { button: back }
  - await: { text: { in: { id: slider-rating }, equals: 'Rating 5.8 to 10.0' } }
