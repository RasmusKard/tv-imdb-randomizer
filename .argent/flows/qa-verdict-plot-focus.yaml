steps:
  - echo: On a long-plot verdict the plot is a clamped teaser that can never take focus — right from Pick another must move along the action row onto Watched it, and selecting there must answer the watched button, not a plot. No expand affordance exists any more; if one ever returns, the hidden check below fails
  - launch: com.delfiapp.tvimdbrandomizer
  - await: { visible: { id: btn-roll } }
  - await: { idle: true }
  - echo: Narrow to the long-plot window - rating Awful
  - tool: tv-remote
    args: { button: [up, up, up, up, up, up, up, up] }
    delayMs: 700
  - tool: tv-remote
    args: { button: [right, right, right] }
  - tool: tv-remote
    args: { button: select }
  - assert: { text: { in: { id: slider-rating }, contains: 'Rating 0.0 to 3.0' } }
  - echo: Year Classic
  - tool: tv-remote
    args: { button: [down, down] }
    delayMs: 800
  - tool: tv-remote
    args: { button: [right, right, right, right, right, right] }
  - tool: tv-remote
    args: { button: select }
  - assert: { text: { in: { id: slider-year }, contains: 'Year 1894 to 1979' } }
  - echo: Votes Obscure
  - tool: tv-remote
    args: { button: [down, down] }
    delayMs: 800
  - tool: tv-remote
    args: { button: right }
  - tool: tv-remote
    args: { button: select }
  - assert: { text: { in: { id: slider-votes }, contains: 'Votes 0 to 1.0K' } }
  - echo: Walk down to the pick button and roll; the verdict must arrive with its plot and its TMDB credit
  - tool: tv-remote
    args: { button: [down, down, down, down] }
    delayMs: 800
  - await: { visible: { id: btn-roll } }
  - tool: tv-remote
    args: { button: select }
  - await: { visible: { id: btn-roll-again } }
  - await: { visible: { id: verdict-title } }
  - await: { idle: true }
  - assert: { visible: { text: 'art & plot' } }
  - echo: No expand affordance — the clamp states the cut with its ellipsis and the full text lives on IMDb
  - assert: { hidden: { text: + more } }
  - echo: Right from Pick another, then select — the watched button answers both presses, so the plot never stole focus and nothing opened
  - tool: tv-remote
    args: { button: right }
  - tool: tv-remote
    args: { button: select }
  - await: { visible: { text: 'On your list' } }
  - await: { visible: { text: 'added to your list' } }
