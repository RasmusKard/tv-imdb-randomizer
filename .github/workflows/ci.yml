name: ci

on:
  push:
    branches: [main]
  pull_request:

# fork PRs are always read-only; this also drops the writable default token
# for runs on same-repo branches
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # leave no GITHUB_TOKEN behind in .git/config for install scripts to find
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn --frozen-lockfile
      - run: yarn typecheck
      - run: yarn checks

  # a release run is triggered by a tag, and nothing a tag run writes can ever
  # be read again (caches saved under a tag are unreachable by later runs) -
  # setup-gradle's own policy of writing only from the default branch matches.
  # this job is that writer: every main push refreshes the shared Gradle state
  # (dependencies, transforms, local build cache) that release.yml restores
  warm-gradle:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # rolling key (os|job|sha) with restore-key fallback: a fresh entry per
      # push, where a lockfile-hashed key would freeze under cache immutability
      # and starve the local build cache. enhanced provider, free for public
      # repos; switch to cache-provider: basic for a fully MIT path
      - uses: gradle/actions/setup-gradle@v6
      - run: yarn --frozen-lockfile
      - run: yarn prebuild:tv
      - run: |
          cd android
          ./gradlew :app:assembleDebug
